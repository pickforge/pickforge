name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type release to publish
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  rust-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            asset-target: linux-x86_64
          - os: macos-14
            rust-target: aarch64-apple-darwin
            asset-target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rust-target }}

      - name: Build Rust binary
        run: cargo build --release --locked --target "${{ matrix.rust-target }}" -p pickforge-cli

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          asset="pickforge-${{ matrix.asset-target }}"
          cp "target/${{ matrix.rust-target }}/release/pickforge" "release-assets/$asset"
          strip "release-assets/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd release-assets && sha256sum "$asset" > "$asset.sha256")
          else
            (cd release-assets && shasum -a 256 "$asset" > "$asset.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pickforge-${{ matrix.asset-target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: rust-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      # Manual dispatches are safe dry runs unless the owner types the explicit confirmation.
      - name: Report dispatch dry run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'release'
        run: |
          echo '## Release dry run' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build and test jobs ran, but publishing was skipped because `confirm` was not `release`.' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate release version
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event.inputs.confirm == 'release'
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          RELEASE_TAG="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]; then
            echo "release tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - run: bun run typecheck

      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            imagemagick \
            x11vnc \
            xdotool \
            xterm \
            xvfb

      - name: Ensure a headed browser is available
        run: |
          if command -v google-chrome-stable >/dev/null \
            || command -v chromium >/dev/null \
            || command -v chromium-browser >/dev/null; then
            echo "browser already present"
          else
            wget -q -O /tmp/google-chrome.deb \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y --no-install-recommends /tmp/google-chrome.deb
          fi
          command -v google-chrome-stable \
            || command -v chromium \
            || command -v chromium-browser

      - run: bun run test
        env:
          PICKFORGE_REQUIRE_BROWSER: "1"
          PICKFORGE_CHROME_NO_SANDBOX: "1"

      - run: bun run build

      - name: Install npm with trusted publishing support
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event.inputs.confirm == 'release'
        run: npm install --global npm@11.5.1

      - name: Upload sourcemaps to Sentry
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event.inputs.confirm == 'release'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pickforge
          SENTRY_PROJECT: pickforge-lab
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set; skipping"
            exit 0
          fi
          if ! {
            npx --yes @sentry/cli sourcemaps inject packages/cli/dist &&
            npx --yes @sentry/cli sourcemaps upload --release "pickforge@$RELEASE_VERSION" packages/cli/dist
          }; then
            echo "::warning::Sentry sourcemap upload failed; continuing release"
          fi

      - name: Publish pickforge
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event.inputs.confirm == 'release'
        working-directory: packages/cli
        run: |
          if npm view "pickforge@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "pickforge@$RELEASE_VERSION is already published; skipping"
          elif [[ "$RELEASE_VERSION" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi

      - name: Download Rust release assets
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event.inputs.confirm == 'release'
        uses: actions/download-artifact@v4
        with:
          pattern: pickforge-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event.inputs.confirm == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; reusing"
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --draft --prerelease --generate-notes
          else
            gh release create "$RELEASE_TAG" --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
