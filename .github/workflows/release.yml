name: Release

# Publishing is gated on artifacts that were actually executed. The candidate
# npm tarball and Rust assets are built once, proven by the Linux container and
# Apple silicon smokes, and only then published — the same files, not a rebuild.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Leave empty for a dry run. To publish, type the exact release tag,
          for example v0.4.0-alpha.2.
        required: false
        default: ""
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default. Only the publish job is granted write and OIDC, and it
# only runs for a confirmed publish, so a dispatch without the exact tag cannot
# publish even if a later step were wrong: it has no token to publish with.
permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the release candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve version and publish intent
        id: resolve
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          VERSION="$(node scripts/check-release-versions.mjs)"
          TAG="v$VERSION"
          PUBLISH=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/check-release-versions.mjs "$GITHUB_REF_NAME" >/dev/null
            PUBLISH=true
          elif [ "$CONFIRM" = "$TAG" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            PUBLISH=true
          elif [ -n "$CONFIRM" ]; then
            echo "::notice::confirm \"$CONFIRM\" is not \"$TAG\" on main; this run is a dry run"
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release $TAG"
            echo
            if [ "$PUBLISH" = "true" ]; then
              echo "This run publishes after every gate and both candidate smokes pass."
            else
              echo "Dry run: every gate and both candidate smokes run, and nothing is published."
              echo "To publish from a dispatch, type \`$TAG\` in the confirm input on \`main\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  candidates:
    name: Candidate artifacts
    needs: resolve
    uses: ./.github/workflows/candidate-artifacts.yml
    permissions:
      contents: read

  lab-gates:
    name: Lab gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            imagemagick \
            x11vnc \
            xdotool \
            xterm \
            xvfb

      - name: Ensure a headed browser is available
        run: |
          if command -v google-chrome-stable >/dev/null \
            || command -v chromium >/dev/null \
            || command -v chromium-browser >/dev/null; then
            echo "browser already present"
          else
            wget -q -O /tmp/google-chrome.deb \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y --no-install-recommends /tmp/google-chrome.deb
          fi
          command -v google-chrome-stable \
            || command -v chromium \
            || command -v chromium-browser

      - run: bun run test
        env:
          PICKFORGE_REQUIRE_BROWSER: "1"
          PICKFORGE_CHROME_NO_SANDBOX: "1"

  rust-gates:
    name: Rust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked

  publish:
    name: Publish
    needs: [resolve, candidates, lab-gates, rust-gates]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refuse to publish an unconfirmed run
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          else
            test "$CONFIRM" = "$RELEASE_TAG"
            test "$GITHUB_REF" = "refs/heads/main"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: candidate-npm
          path: candidate

      - uses: actions/download-artifact@v4
        with:
          pattern: pickforge-*
          path: release-assets
          merge-multiple: true

      # The tarball the smokes installed is the tarball that gets published.
      - name: Verify the candidate tarball
        run: |
          set -eu
          cd candidate/npm
          sha256sum -c "pickforge-${RELEASE_VERSION}.tgz.sha256"
          echo "TARBALL=$PWD/pickforge-${RELEASE_VERSION}.tgz" >> "$GITHUB_ENV"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      # Uploads the sourcemaps that are *inside* the verified tarball, and the
      # JavaScript they belong to, unmodified. The old job injected debug IDs
      # into a copy of `dist` after the smokes had already installed the packed
      # tarball, so the maps Sentry held described bytes npm never received.
      # Nothing may rewrite the candidate: `telemetry.ts` reports
      # `release: pickforge@<version>`, which is the same release name used
      # here, so Sentry resolves these maps by release without a debug ID.
      - name: Upload the published tarball's sourcemaps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pickforge
          SENTRY_PROJECT: pickforge-lab
        run: |
          set -eu
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN not set; skipping"
            exit 0
          fi
          rm -rf sentry-sourcemaps
          mkdir -p sentry-sourcemaps
          tar -xzf "$TARBALL" -C sentry-sourcemaps
          test -d sentry-sourcemaps/package/dist
          if ! npx --yes @sentry/cli sourcemaps upload \
            --release "pickforge@$RELEASE_VERSION" sentry-sourcemaps/package/dist; then
            echo "::warning::Sentry sourcemap upload failed; continuing release"
          fi
          rm -rf sentry-sourcemaps

      # Publishing the packed tarball, not a rebuild, is what makes the smokes
      # meaningful. If npm ever rejects provenance for a tarball publish, fix
      # the workflow: do not fall back to publishing a rebuilt, unsmoked tree.
      - name: Publish pickforge
        run: |
          set -eu
          if npm view "pickforge@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "pickforge@$RELEASE_VERSION is already published; skipping"
          elif [[ "$RELEASE_VERSION" == *-* ]]; then
            npm publish "$TARBALL" --access public --provenance --tag next
          else
            npm publish "$TARBALL" --access public --provenance
          fi

      # A published release is public and immutable as far as this job is
      # concerned: CHECKLIST.md step 11 forbids overwriting a published tag, so
      # the job must refuse too. Assets are only ever replaced on a draft, and a
      # re-run that finds the draft already complete leaves it exactly as it is.
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$RELEASE_TAG is already published; refusing to replace public assets." \
                "Fix forward with a new version and tag."
              exit 1
            fi
            echo "GitHub release $RELEASE_TAG exists and is still a draft; reusing"
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --draft --prerelease \
              --title "Pickforge $RELEASE_VERSION" --notes-file docs/releases/UNRELEASED.md
          else
            gh release create "$RELEASE_TAG" --draft \
              --title "Pickforge $RELEASE_VERSION" --notes-file docs/releases/UNRELEASED.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Summarize
        run: |
          {
            echo "## Published $RELEASE_TAG"
            echo
            echo "- npm: the packed candidate tarball, published with provenance"
            echo "- GitHub: draft release with the smoked Rust assets and checksums"
            echo "- A human still has to review and publish the draft."
          } >> "$GITHUB_STEP_SUMMARY"
