[package]
name = "pickforge-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native picture-in-picture viewer for Pickforge lab sessions on Linux"

[[bin]]
name = "pickforge-viewer"
path = "src/main.rs"

[lib]
name = "pickforge_viewer"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
fontdb = { version = "0.23", default-features = false, features = ["fs", "memmap", "fontconfig"] }
libc = "0.2"
swash = "0.2.10"
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
unicode-bidi = "0.3"
wayland-client = { version = "0.31", default-features = false, features = ["system", "dlopen"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
wl-clipboard-rs = { version = "0.9.5", default-features = false }
x11rb = { version = "0.13", features = ["shm", "damage", "xfixes", "xinput", "xkb", "xtest"] }
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
x11rb = { version = "0.13", features = ["xtest"] }
