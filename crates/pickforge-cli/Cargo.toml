[package]
name = "pickforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Experimental Pickforge CLI: project readiness diagnostics"

[[bin]]
name = "pickforge"
path = "src/main.rs"

[lib]
name = "pickforge_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
which = "8"

[dev-dependencies]
assert_cmd = "2"
