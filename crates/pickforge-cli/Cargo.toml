[package]
name = "pickforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Experimental Pickforge CLI: project readiness diagnostics"

[[bin]]
name = "pickforge"
path = "src/main.rs"

[lib]
name = "pickforge_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
regex = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tempfile = "3"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
which = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_cmd = "2"
