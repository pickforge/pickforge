<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickforge watch</title>
<link rel="stylesheet" href="/viewer-assets/viewer.css">
<script type="module" src="/viewer-assets/viewer.js"></script>
</head>
<body data-mode="thumbnail" data-status="connecting">
<main id="screen" aria-label="Live session view, read-only"></main>
<div id="shield" title="Expand"></div>
<p id="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status-text">Connecting</span></p>
<div id="toolbar" hidden>
<span class="live"><span class="dot" aria-hidden="true"></span>Live</span>
<button id="collapse" type="button" title="Collapse (Esc)">Collapse</button>
</div>
</body>
</html>
